<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Khóa luận tốt nghiệp — Bản xem trước</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #334155;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f1f5f9;
        --panel: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --border: #e2e8f0;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 16px;
    }
    header h1 {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 0;
      flex: 1 1 260px;
      line-height: 1.4;
    }
    .meta {
      color: var(--muted);
      font-size: 0.8rem;
      flex: 0 0 auto;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      transition: background 0.15s ease;
    }
    .btn:hover { background: var(--accent-hover); }
    main { flex: 1 1 auto; position: relative; min-height: 0; }
    iframe, embed {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .fallback {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
    }
    .fallback a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>Khóa luận tốt nghiệp — Bản xem trước PDF</h1>
    <span class="meta">Cập nhật: <time id="build-time">__BUILD_TIME__</time></span>
    <a class="btn" href="main.pdf" download>⬇ Tải PDF</a>
    <a class="btn" href="main.pdf" target="_blank" rel="noopener" style="background:transparent;border:1px solid var(--border);color:var(--text)">Mở tab mới</a>
  </header>
  <main>
    <!-- Nhúng PDF; trình duyệt không hỗ trợ sẽ hiện phần fallback bên trong -->
    <object data="main.pdf" type="application/pdf" width="100%" height="100%">
      <div class="fallback">
        <p>Trình duyệt của bạn không nhúng được PDF trực tiếp.</p>
        <p><a href="main.pdf">Nhấn vào đây để mở/tải file PDF</a>.</p>
      </div>
    </object>
  </main>
</body>
</html>
